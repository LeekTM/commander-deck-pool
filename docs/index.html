<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Commander Deck Pool</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site">
  <h1>🎴 Commander Deck Pool</h1>
  <nav>
    <a href="index.html" class="active">Browse</a>
    <a href="submit.html">Submit a deck</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<main>
  <div class="card">
    <h2>Filter &amp; sort</h2>
    <div class="filters">
      <div>
        <label for="f-search">Name / commander / tag</label>
        <input type="text" id="f-search" placeholder="atraxa, goblins, superfriends..." />
      </div>
      <div>
        <label for="f-bracket">Bracket</label>
        <select id="f-bracket">
          <option value="">Any</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div>
        <label for="f-price">Max price (EUR)</label>
        <input type="text" id="f-price" placeholder="e.g. 200" inputmode="numeric" />
      </div>
      <div>
        <label for="f-colors">Colours (must include)</label>
        <input type="text" id="f-colors" placeholder="e.g. WU" />
      </div>
      <div>
        <label for="f-sort">Sort by</label>
        <select id="f-sort">
          <option value="name-asc">Name (A&ndash;Z)</option>
          <option value="name-desc">Name (Z&ndash;A)</option>
          <option value="price-asc">Price (cheapest first)</option>
          <option value="price-desc">Price (most expensive first)</option>
          <option value="bracket-asc">Bracket (lowest first)</option>
          <option value="bracket-desc">Bracket (highest first)</option>
          <option value="gc-asc">Game Changers (fewest first)</option>
          <option value="gc-desc">Game Changers (most first)</option>
        </select>
      </div>
      <div>
        <label for="f-view">View</label>
        <select id="f-view">
          <option value="list">List</option>
          <option value="visual">Card images</option>
        </select>
      </div>
    </div>
    <p class="hint" id="result-count"></p>
  </div>

  <div id="decks" class="deck-list"></div>
  <p class="hint" id="load-status">Loading deck_db.json...</p>
</main>

<footer class="site">
  Database generated by <a id="link-ingest" href="#">ingest_decks.py</a> from
  <a id="link-decks" href="#">decks/</a>. Prices via Scryfall (cheapest printing, EUR/USD), rebuilt automatically on every submission.
</footer>

<script src="config.js"></script>
<script src="js/scryfall.js"></script>
<script src="js/browse.js"></script>
</body>
</html>
