name: Submit a Commander deck
description: Add a decklist to the shared pool
title: "[Deck] "
labels: ["deck-submission"]
body:
  - type: textarea
    id: decklist
    attributes:
      label: Decklist
      description: >
        Paste the exported decklist (MTGGoldfish "Exact Card Versions",
        Moxfield export, Archidekt export-to-text, or an EDHREC list all
        work). Mark your commander with a "Commander" section, or tag the
        line with *CMDR*. To set tags or override the bracket, add
        "// tags: your, tags" and/or "// bracket: N" as the first lines
        (the submission page does this for you automatically).
      placeholder: |
        // tags: superfriends, planeswalkers, grindy
        // bracket: 4

        Commander
        1 Atraxa, Praetors' Voice

        Deck
        1 Sol Ring
        1 Arcane Signet
        ...
      render: text
    validations:
      required: true
