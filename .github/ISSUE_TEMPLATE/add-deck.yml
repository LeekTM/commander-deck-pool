name: Submit a Commander deck
description: Add a decklist to the shared pool
title: "[Deck] "
labels: ["deck-submission"]
body:
  - type: markdown
    attributes:
      value: |
        There's no name field -- the deck's name in the pool is generated
        automatically as "<Commander> (Bracket N)".

  - type: textarea
    id: decklist
    attributes:
      label: Decklist
      description: >
        Paste the exported decklist (MTGGoldfish "Exact Card Versions",
        Moxfield export, Archidekt export-to-text, or an EDHREC list all
        work). Mark your commander with a "Commander" section, or tag the
        line with *CMDR*.
      placeholder: |
        Commander
        1 Atraxa, Praetors' Voice

        Deck
        1 Sol Ring
        1 Arcane Signet
        ...
      render: text
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated)
      description: >
        No fixed list -- reuse a tag already used elsewhere in the pool if
        one fits (see the submission page or browse the existing decks), or
        make up a new one. Leave blank if you're not sure.
      placeholder: superfriends, planeswalkers, grindy
    validations:
      required: false

  - type: dropdown
    id: bracket
    attributes:
      label: Bracket
      description: >
        Validate on the submission page first to see the calculated
        bracket, then select that number here -- don't leave this on
        "Calculate".
      options:
        - "Calculate"
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
      default: 0
    validations:
      required: true
