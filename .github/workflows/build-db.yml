name: Build deck database

# Rebuilds deck_db.json whenever decks/ (or the ingest code) changes on main:
# a merged PR, an admin-panel edit/delete, or a hand-pushed commit. Does NOT
# trigger on deck_db.json itself changing, so this workflow's own commit can't
# re-trigger itself.
#
# It also does NOT cover issue-to-deck.yml's commits: a push made with the
# default GITHUB_TOKEN never triggers another workflow (GitHub's guard against
# recursive runs), so that workflow rebuilds the database inline itself.
on:
  push:
    branches: [main]
    paths:
      - "decks/**"
      - "ingest_decks.py"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deck_db.json
        run: python ingest_decks.py decks/ --out deck_db.json

      - name: Publish a copy for GitHub Pages
        # GitHub Pages serves only docs/, but deck_db.json's source-of-truth
        # location (per the data contract) is the repo root -- so mirror it
        # into docs/ for the submission/browse page to fetch.
        run: cp deck_db.json docs/deck_db.json

      - name: Commit if changed
        run: |
          git config user.name "deck-pool-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deck_db.json docs/deck_db.json
          if git diff --cached --quiet; then
            echo "deck_db.json unchanged"
          else
            git commit -m "Rebuild deck_db.json"
            git push
          fi
