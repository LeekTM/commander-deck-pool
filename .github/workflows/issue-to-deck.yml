name: Convert deck submission issue to file

# Turns a filled-out "Submit a Commander deck" issue into decks/<slug>.txt.
# Validates first (scripts/issue_to_deck.py -> scripts/validate_deck.py); an
# invalid submission gets a comment explaining why and a "needs-changes"
# label, and no file is written. A valid one is committed straight to main,
# together with the rebuilt database.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  convert:
    if: contains(github.event.issue.labels.*.name, 'deck-submission')
    runs-on: ubuntu-latest
    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Save issue body to a file
        # Written via os.environ rather than interpolated into the shell
        # script text, so arbitrary user-supplied content in the issue body
        # can't be executed as shell/YAML.
        run: |
          python - <<'PYEOF'
          import os
          with open("issue_body.md", "w", encoding="utf-8") as f:
              f.write(os.environ.get("ISSUE_BODY", ""))
          PYEOF

      - name: Parse, validate, and write the deck file
        id: convert
        run: |
          set +e
          python scripts/issue_to_deck.py --body-file issue_body.md --issue "$ISSUE_NUMBER" --out-dir decks > result.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat result.json

      - name: Commit the deck and rebuild the database
        if: steps.convert.outputs.exit_code == '0'
        run: |
          set -euo pipefail

          DECK_PATH="$(python -c "import json; print(json.load(open('result.json'))['path'])")"
          cp "$DECK_PATH" /tmp/new-deck.txt

          git config user.name "deck-pool-bot"
          git config user.email "actions@users.noreply.github.com"

          # Rebuild deck_db.json here rather than leaving it to build-db.yml.
          # A push made with the default GITHUB_TOKEN does not trigger other
          # workflows (GitHub's guard against recursive runs), so build-db.yml
          # never fires for this commit -- the deck file would land in decks/
          # and the database would silently stay stale.
          #
          # Two submissions made close together both check out the same commit,
          # both rebuild, and then race to push. The loser used to die on
          # "! [rejected] (fetch first)", having already commented that the deck
          # was added. Rebuild against whatever is on main now, and try again.
          #
          # ingest is incremental (it re-enriches only the deck whose file
          # changed, reusing cached records for the rest), so a rebuild is a
          # couple of seconds rather than the ~90s it took when every
          # submission re-fetched the whole pool. That shrinks the window these
          # retries exist for, and makes each retry cheap.
          pushed=0
          for attempt in 1 2 3 4 5; do
            python ingest_decks.py decks/ --out deck_db.json --tts-dir docs/tts
            cp deck_db.json docs/deck_db.json

            git add decks/ deck_db.json docs/deck_db.json docs/tts
            git commit -m "Add deck from issue #$ISSUE_NUMBER" || true

            if git push; then
              pushed=1
              break
            fi

            echo "Push rejected on attempt $attempt -- another run got there first. Resyncing."
            git fetch origin main
            git reset --hard origin/main

            # The reset took our deck file with it. If another deck claimed the
            # same slug while we were building, fall back to the issue-numbered
            # name, matching unique_path() in issue_to_deck.py.
            if [ -e "$DECK_PATH" ]; then
              DECK_PATH="${DECK_PATH%.txt}-$ISSUE_NUMBER.txt"
            fi
            cp /tmp/new-deck.txt "$DECK_PATH"

            sleep $(( (RANDOM % 15) + 5 ))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "Could not push after 5 attempts."
            exit 1
          fi

      # Runs only once the push has actually landed, so a lost race can no
      # longer leave an issue claiming the deck was added when it wasn't.
      - name: Comment and close the issue
        if: steps.convert.outputs.exit_code == '0'
        run: |
          python - <<'PYEOF'
          import json
          r = json.load(open("result.json"))
          lines = [
              f"Added **{r['name']}** to the pool.",
              "",
              f"- Commander(s): {', '.join(r['commanders'])}",
              f"- Cards: {r['total_cards']}",
              f"- Colours: {r['colors'] or 'Colourless'}",
              f"- Game Changers: {r['gc']}",
              f"- Bracket: {r['bracket']}" + (" (your override)" if r["bracket_overridden"] else " (computed)"),
              f"- Price: EUR {r['price_eur']} / USD {r['price_usd']}",
          ]
          if r["warnings"]:
              lines += ["", "Warnings:"] + [f"- {w}" for w in r["warnings"]]
          with open("comment.md", "w", encoding="utf-8") as f:
              for line in lines:
                  print(line, file=f)
          PYEOF
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Say so if a valid deck could not be committed
        if: failure() && steps.convert.outputs.exit_code == '0'
        run: |
          python - <<'PYEOF'
          lines = [
              "This deck is valid, but it could not be committed: another "
              "submission was being processed at the same time and the retries "
              "ran out.",
              "",
              "Nothing is wrong with the deck itself. Submit it again and it "
              "should go straight through.",
          ]
          with open("comment.md", "w", encoding="utf-8") as f:
              for line in lines:
                  print(line, file=f)
          PYEOF
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md

      - name: Comment on failure
        if: steps.convert.outputs.exit_code != '0'
        run: |
          python - <<'PYEOF'
          import json
          r = json.load(open("result.json"))
          lines = ["This submission couldn't be added:", ""]
          lines += [f"- {e}" for e in r["errors"]]
          if r.get("warnings"):
              lines += ["", "Warnings:"] + [f"- {w}" for w in r["warnings"]]
          lines += [
              "",
              "Fix the issue above and open a new submission -- or use the "
              "submission page, which checks all of this before you submit.",
          ]
          with open("comment.md", "w", encoding="utf-8") as f:
              for line in lines:
                  print(line, file=f)
          PYEOF
          gh label create "needs-changes" --color FBCA04 --force
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md
          gh issue edit "$ISSUE_NUMBER" --add-label "needs-changes"
